name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check shortlink-skipper.user.js
      - uses: softprops/action-gh-release@v2
        with:
          files: shortlink-skipper.user.js
          generate_release_notes: true
