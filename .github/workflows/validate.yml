name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check shortlink-skipper.user.js
      - name: Metadata check
        run: |
          grep -q "@name         Shortlink Skipper" shortlink-skipper.user.js
          grep -q "@version" shortlink-skipper.user.js
          grep -q "@downloadURL" shortlink-skipper.user.js
          node -e "const s=require('fs').readFileSync('shortlink-skipper.user.js','utf8').split('\n').slice(14).join('\n'); if(/[^\x00-\x7F]/.test(s)){console.error('non-ASCII found in code');process.exit(1)}"
      - name: Run tests
        run: npm test
